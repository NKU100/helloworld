name: Build

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true

jobs:
  vcpkg-install:
    name: Install Dependencies (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - arch: x86
            triplet: x86-windows-static
          - arch: x64
            triplet: x64-windows-static

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: vcpkg_installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install --triplet ${{ matrix.triplet }} --x-install-root=vcpkg_installed

      - name: Upload vcpkg_installed
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-installed-${{ matrix.arch }}
          path: vcpkg_installed
          retention-days: 1

  build:
    name: Build (${{ matrix.arch }})
    needs: vcpkg-install
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - arch: x86
            msvc_arch: x86
            preset: x86-release
          - arch: x64
            msvc_arch: amd64
            preset: x64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download vcpkg_installed
        uses: actions/download-artifact@v8
        with:
          name: vcpkg-installed-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/vcpkg_installed

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.msvc_arch }} -host_arch=amd64
          cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.msvc_arch }} -host_arch=amd64
          cmake --build --preset ${{ matrix.preset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HelloWorld-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/helloworld/HelloWorld.exe
          if-no-files-found: error
          retention-days: 1
