name: Pre Release

on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "v**"
      - "ci"
  workflow_dispatch:

concurrency:
  group: pre-release
  cancel-in-progress: true

jobs:
  vcpkg-install:
    name: Install Dependencies (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - arch: x86
            triplet: x86-windows-static
          - arch: x64
            triplet: x64-windows-static

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: vcpkg_installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install --triplet ${{ matrix.triplet }} --x-install-root=vcpkg_installed

      - name: Upload vcpkg_installed
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-installed-${{ matrix.arch }}
          path: vcpkg_installed
          retention-days: 1

  build:
    name: Build (${{ matrix.arch }})
    needs: vcpkg-install
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - arch: x86
            msvc_arch: x86
            preset: x86-release
          - arch: x64
            msvc_arch: amd64
            preset: x64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download vcpkg_installed
        uses: actions/download-artifact@v8
        with:
          name: vcpkg-installed-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/vcpkg_installed

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.msvc_arch }} -host_arch=amd64
          cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.msvc_arch }} -host_arch=amd64
          cmake --build --preset ${{ matrix.preset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HelloWorld-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/helloworld/HelloWorld.exe
          if-no-files-found: error
          retention-days: 1

  pre-release:
    name: Pre Release
    needs: build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download x86 build
        uses: actions/download-artifact@v8
        with:
          name: HelloWorld-x86
          path: artifacts/x86

      - name: Download x64 build
        uses: actions/download-artifact@v8
        with:
          name: HelloWorld-x64
          path: artifacts/x64

      - name: Rename artifacts
        shell: pwsh
        run: |
          Rename-Item -Path "artifacts/x86/HelloWorld.exe" -NewName "HelloWorld-x86.exe"
          Rename-Item -Path "artifacts/x64/HelloWorld.exe" -NewName "HelloWorld-x64.exe"

      - name: Update ci tag
        run: |
          git tag -f ci
          git push origin ci -f

      - name: Build changelog
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: build/changelog.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/changelog.md
          prerelease: true
          name: CI Build
          tag_name: ci
          files: |
            artifacts/x86/HelloWorld-x86.exe
            artifacts/x64/HelloWorld-x64.exe
